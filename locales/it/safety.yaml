emergency:
  title: "Emergenza"
  body: |
    Chiama subito il 1414 (Rega, Svizzera) o il 112 (numero d'emergenza europeo).
    Comunica la tua posizione esatta (coordinate o condivisione della posizione in questa app).
    Resta dove sei, salvo pericolo immediato. Tieni al caldo la persona ferita.
    Resta raggiungibile: telefono acceso, linea libera.
safety_answer_frame: "Ecco cosa è noto, cosa è ignoto e cosa puoi decidere solo tu."
