fixed_line: "Bergbot informa. La decisione è tua."
danger_levels:
  "1": "debole"
  "2": "moderato"
  "3": "marcato"
  "4": "forte"
  "5": "molto forte"
t_grades:
  T1: "Escursione — sentiero ben segnalato, terreno pianeggiante o poco ripido, nessuna esposizione al vuoto."
  T2: "Escursione di montagna — sentiero continuo, ripido a tratti, possibile pericolo di caduta; piede fermo necessario."
  T3: "Escursione di montagna impegnativa — sentiero non sempre visibile, tratti esposti talvolta assicurati; piede fermo e buoni scarponi."
  T4: "Escursione alpina — sentiero in parte assente, a tratti servono le mani, terreno esposto; esperienza alpina richiesta."
  T5: "Escursione alpina impegnativa — spesso senza sentiero, facile arrampicata, possibili ghiacciai; capacità alpinistiche richieste."
  T6: "Escursione alpina difficile — quasi sempre senza sentiero, arrampicata fino al II grado, forte esposizione; solo alpinisti esperti."
