emergency:
  title: "Notfall"
  body: |
    Ruf jetzt 1414 (Rega, Schweiz) oder 112 (europäische Notrufnummer) an.
    Teile deine genaue Position mit (Koordinaten oder Standortfreigabe in dieser App).
    Bleib, wo du bist, ausser du bist in unmittelbarer Gefahr. Halte die verletzte Person warm.
    Bleib erreichbar: Telefon an, Leitung frei.
safety_answer_frame: "Hier ist, was bekannt ist, was unbekannt ist und was nur du entscheiden kannst."
