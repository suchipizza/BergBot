t_grades:
  T1: "Wandern — Weg gut markiert, Gelände flach oder leicht geneigt, keine Absturzgefahr."
  T2: "Bergwandern — durchgehender Weg, stellenweise steil, Absturzgefahr möglich; Trittsicherheit nötig."
  T3: "Anspruchsvolles Bergwandern — Weg nicht immer sichtbar, exponierte Stellen teils gesichert; Trittsicherheit und gute Schuhe."
  T4: "Alpinwandern — Weg teilweise fehlend, stellenweise Hände nötig, exponiertes Gelände; alpine Erfahrung erforderlich."
  T5: "Anspruchsvolles Alpinwandern — oft weglos, einfache Kletterstellen, Gletscherpassagen möglich; Bergsteigerkenntnisse erforderlich."
  T6: "Schwieriges Alpinwandern — meist weglos, Kletterstellen bis II, ernste Exposition; nur für erfahrene Bergsteiger."
