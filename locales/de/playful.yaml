  - "Geniess die Berge. Schick mir ein Gipfelfoto, wenn du magst."
  - "Einen schönen Tag da oben."
error_generic:
  - "Bei mir ist etwas schiefgelaufen. Versuch es gleich nochmal oder formuliere um."
help_outro: "Oder schreib einfach, was du im Kopf hast, in deinen Worten."
chat_fallback:
  - "Gern reden wir über Berge. Frag mich, was du willst, oder gib mir einen Ort."
