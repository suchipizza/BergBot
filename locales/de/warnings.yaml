  body: "Zwischen km {from_km} und km {to_km} gilt eine offizielle Umleitung ({source})."
fire_restriction:
  title: "Feuerverbot / Einschränkung"
  body: "{scope}: {restriction} ({source})."
fire_danger:
  title: "Waldbrandgefahr"
  body: "Waldbrandgefahrenstufe {level} ({label}) im Gebiet der Route ({source})."
shooting_activity:
  title: "Schiessbetrieb"
  body: "Die Route quert die Schiesszone {name}; am {date} {times} ist Schiessbetrieb angekündigt ({source})."
shooting_zone:
