  body: "Bis {temp_c} °C am tiefsten Punkt der Route um {time} prognostiziert."
cold:
  title: "Kälte"
  body: "Bis {temp_c} °C am höchsten Punkt der Route um {time} prognostiziert."
natural_hazard:
  title: "Naturgefahren-Warnung"
  body: "{authority} hat eine Warnung der Stufe {level} herausgegeben: {kind} ({source})."
avalanche_context:
  title: "Lawinenbulletin"
  body: "{text}"
snow_context:
  title: "Schnee"
  body: "An diesem Datum ist oberhalb von {elevation_m} m Schnee möglich; die Route erreicht {max_elevation_m} m."
