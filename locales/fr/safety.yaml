fixed_line: "Bergbot informe. La décision t'appartient."
danger_levels:
  "1": "faible"
  "2": "limité"
  "3": "marqué"
  "4": "fort"
  "5": "très fort"
t_grades:
  T1: "Randonnée — sentier bien balisé, terrain plat ou peu incliné, pas de risque de chute."
  T2: "Randonnée en montagne — sentier continu, raide par endroits, risque de chute possible ; bon pied nécessaire."
  T3: "Randonnée en montagne exigeante — sentier pas toujours visible, passages exposés parfois assurés ; pied sûr et bonnes chaussures."
  T4: "Randonnée alpine — sentier partiellement absent, mains nécessaires par endroits, terrain exposé ; expérience alpine requise."
  T5: "Randonnée alpine exigeante — souvent sans sentier, escalade facile, glaciers possibles ; compétences d'alpinisme requises."
  T6: "Randonnée alpine difficile — presque sans sentier, escalade jusqu'au 2e degré, forte exposition ; alpinistes chevronnés uniquement."
