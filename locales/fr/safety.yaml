emergency:
  title: "Urgence"
  body: |
    Appelle immédiatement le 1414 (Rega, Suisse) ou le 112 (numéro d'urgence européen).
    Transmets ta position exacte (coordonnées ou partage de position dans cette appli).
    Reste sur place sauf danger immédiat. Garde la personne blessée au chaud.
    Reste joignable : téléphone allumé, ligne libre.
safety_answer_frame: "Voici ce qui est connu, ce qui est inconnu, et ce que toi seul·e peux décider."
